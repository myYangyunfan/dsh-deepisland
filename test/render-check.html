<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VibeIsland 渲染验证</title>
<!-- 真实 CSS：从 client.js 的 CSS_STYLES 抽取后落盘为 extracted.css（file:// 下 fetch 会被 CORS 拦） -->
<link id="dsh-vibe-island-styles" rel="stylesheet" href="extracted.css">
<style>
  body { margin:0; background:#1a1a1e; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #probe { position:fixed; left:12px; bottom:12px; color:#8a8a95; font:11px monospace; z-index:1; white-space:pre; }
</style>
</head>
<body>
<div id="probe">loading…</div>
<div id="dsh-vibe-island-root"></div>
<script>
// CSS 由上方 <link href="extracted.css"> 提供（与生产完全同一份）
(() => {
  // ---- 复刻 client.js 的组件渲染（同一份 h() 调用结构）----
  window.__errors = [];
  window.addEventListener('error', e => window.__errors.push(String(e.message)));

  const h = (t, p, ...c) => ({ type: t, props: p || {}, children: c.flat(Infinity).filter(x => x !== null && x !== undefined && x !== false) });
  const fmt = (s) => { if(!s||s<0) return '00:00'; const m=Math.floor(s/60), x=Math.floor(s%60);
    return `${m<10?'0':''}${m}:${x<10?'0':''}${x}`; };

  // 用假 activity 渲染胶囊（结构与 client.js 完全一致）
  function render(root, { status, title, currentTool, elapsed, toolCount, subagentCount, expanded, platform, placement }) {
    const dotClass = status==='thinking'?'dot-thinking':status==='tool'?'dot-tool':status==='waiting'?'dot-waiting':'dot-idle';
    const glowClass = status==='thinking'?'glow-thinking':status==='tool'?'glow-tool':status==='waiting'?'glow-waiting':'';
    const badgeText = status==='thinking'?'Thinking':status==='tool'?'Executing Tool':status==='waiting'?'Action Required':'Ready';
    const tree = h('div', { className:`vibe-island-wrapper placement-${placement}` },
      h('div', { className:['vibe-island-pill', platform, expanded?'state-expanded':'state-collapsed',
        status!=='idle'?'has-active':'', glowClass?'glow-active':''].filter(Boolean).join(' ') },
        glowClass ? h('div', { className:`vibe-island-glow ${glowClass}` }) : null,
        !expanded ? h('div', { className:'vibe-compact-row' },
          h('div', { className:'vibe-compact-left' },
            h('div', { className:`vibe-indicator-dot ${dotClass}` }),
            h('div', { className:'vibe-compact-title' }, title)),
          h('div', { className:'vibe-compact-right' },
            subagentCount>0 ? h('div', { className:'vibe-compact-badge vibe-subagent-badge', title:`${subagentCount} 个子代理并行执行中` }, `👥 ${subagentCount}`) : null,
            status!=='idle'&&elapsed>0 ? h('div', { className:'vibe-compact-timer' }, fmt(elapsed)) : null,
            currentTool ? h('div', { className:'vibe-compact-badge' }, currentTool) : null)) : null,
        expanded ? h('div', { style:{display:'flex',flexDirection:'column',height:'100%',width:'100%'} },
          h('div', { className:'vibe-hud-header' },
            h('div', { className:'vibe-hud-title-group' },
              h('div', { className:`vibe-indicator-dot ${dotClass}` }),
              h('div', { className:`vibe-hud-badge-status badge-${status}` }, badgeText),
              h('span', { style:{fontSize:'12px',color:'#a0a0b0',fontWeight:500} }, title)),
            h('button', { className:'vibe-hud-close-btn' }, '✕')),
          h('div', { className:'vibe-hud-body' }, h('div', { className:'vibe-hud-code' }, 'ls -la /tmp')),
          h('div', { className:'vibe-hud-footer' },
            h('div', { className:'vibe-hud-stats' },
              h('div', { className:'vibe-hud-stat-item' }, h('span',{style:{color:'#666'}},'耗时:'), h('span',{style:{fontFamily:'monospace',color:'#ddd'}},fmt(elapsed))),
              h('div', { className:'vibe-hud-stat-item' }, h('span',{style:{color:'#666'}},'工具调用:'), h('span',{style:{fontFamily:'monospace',color:'#ddd'}},`${toolCount} 次`)),
              subagentCount>0 ? h('div', { className:'vibe-hud-stat-item' }, h('span',{style:{color:'#666'}},'子代理:'), h('span',{style:{fontFamily:'monospace',color:'#ddd'}},`${subagentCount} 并行`)) : null),
            h('div', { style:{fontSize:'10px',color:'#606075'} }, 'DeepSeek VibeIsland'))) : null
      ));
    return toReal(tree, root);
  }

  // 把伪元素树转成真实 DOM
  function toReal(node, host) {
    host.innerHTML = '';
    const build = (n) => {
      if (typeof n === 'string' || typeof n === 'number') return document.createTextNode(String(n));
      const e = document.createElement(n.type);
      for (const [k,v] of Object.entries(n.props||{})) {
        if (k === 'className') e.className = v;
        else if (k === 'style') Object.assign(e.style, v);
        else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'title') e.title = v;
      }
      for (const c of n.children||[]) e.appendChild(build(c));
      return e;
    };
    host.appendChild(build(node));
  }

  const root = document.getElementById('dsh-vibe-island-root');
  render(root, { status:'tool', title:'执行 bash', currentTool:'bash', elapsed:65, toolCount:4, subagentCount:3,
                 expanded:false, platform:'platform-macos', placement:'notch' });
  document.getElementById('probe').textContent = 'ready';
  window.__render = render;
})();
</script>
</body>
</html>
