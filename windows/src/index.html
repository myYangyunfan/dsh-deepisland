<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSHNotch</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    岛的本体。窗口按**最大展开态**一次开好（见 main.js 的 MAX_WINDOW），
    本体顶对齐钉在窗口顶端、水平居中 —— 展开收起只是它自己在窗口里
    改宽改高，窗口一个字节都不动，动画全程 60fps 不被 DWM 的窗口
    尺寸动画拖累。这是 macOS 版（NotchPanel/NotchMetrics）的同款架构：
    「窗口按最大展开态开，内容视图在内部动画」。

    ## 为什么没有 .neck 了

    旧版窗口紧贴内容、逐帧跟尺寸，需要一段负 margin 的「连接器」把方角
    推到屏幕外。现在窗口顶端就钉在屏幕顶边（y = workArea.y），岛体顶端
    与屏幕顶端重合，顶边两个方角天然落在屏幕边界上 —— 与 Mac 的
    「形状顶端 = 屏幕顶端」同一结论，无需额外机关。

    ## 点击穿透

    窗口平时 setIgnoreMouseEvents(true, {forward:true})：只有本体的像素
    「底下有内容」时渲染层才请主进程临时接管（island:set-interactive），
    其余透明区域全部穿透 —— 否则这个比岛大一圈的窗口会长期吞掉
    它下方应用的点击。
  -->
  <div id="island" class="island">
    <div id="pinned-hint" class="pinned-hint"></div>
    <div id="primary" class="primary"></div>
    <div id="list" class="list"></div>
    <div id="stats" class="stats"></div>
    <div id="footer" class="footer"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
