name: Release

# 为什么发布要放在 CI 上：
#   作者本机所在的网络对 api.github.com 是 SNI 级阻断（github.com 正常，
#   所以 git push 一直好使，但 gh release create 永远 502/超时）。
#   Actions runner 在境外，创建 release 与上传附件都不受这条链路影响。
#   git push 走 git 协议，因此「推 tag 触发发布」这条路是通的。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（须已存在，例如 v0.3.0）'
        required: true

permissions:
  contents: write

jobs:
  release-macos:
    name: macOS (arm64)
    # 带刘海的 Mac 全是 Apple Silicon，产物必须是 arm64，所以要求 arm64 runner。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 不能省。`swift/build.sh` 在本仓库的 git 里被记成 100644（无可执行位），
      # checkout 出来的文件对 CI 的 bash 就是「Permission denied」——
      # 已实测：正是这一行不通导致整个 macOS job 在第一步就挂，
      # 而 Windows job 写了 `needs: release-macos`，于是**连带触发不了**，
      # 症状表面看是「Windows 资产永远不会发布」。
      # 补 chmod 比改 git 文件模式稳：后者一旦被人误改回 644，这坑会原样复现。
      - name: 给构建脚本加可执行位
        run: chmod +x swift/build.sh

      - name: 环境信息
        run: |
          sw_vers
          echo "架构: $(uname -m)"
          swiftc --version | head -1
          echo "SDK: $(xcrun --show-sdk-path)"

      - name: 断言 runner 是 Apple Silicon
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "❌ runner 架构是 $(uname -m)，本包必须 arm64（同包的 zstdlite 也需 arm64）"
            exit 1
          fi
          echo "✅ arm64"

      - name: 产物版本号必须与 tag 一致
        # 与 Windows 侧同一条纪律：产物名由 `CFBundleShortVersionString` 决定，
        # 写在 Info.plist 里，跟 tag 是**两份独立的事实**。
        # 实测事故：tag 打 v1.2.0、plist 里却还是 0.3.0，CI 于是上传了
        # `DSHNotch-0.3.0-arm64.zip`，插件按 1.2.0 去找，永远找不到。
        # 不在这里卡死，只能等用户在自己机器上撞见「资产不存在」。
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          cd swift
          TAG="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
          VER="${TAG#v}"
          PLIST=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          echo "tag=$TAG  plist版本=$PLIST"
          if [ "$PLIST" != "$VER" ]; then
            echo "❌ Resources/Info.plist 版本 $PLIST 与 tag $VER 不一致，先改 Info.plist"
            exit 1
          fi
          echo "✅ 版本一致"

      - name: 编译 + 组装 .app + 打包
        env:
          # CI 没有登录图形会话，跳过需要窗口服务器的运行自检；
          # 「zstdlite 已随包」与「代码签名完好」两项校验照常执行。
          DSHNOTCH_SKIP_SELFTEST: '1'
        run: |
          cd swift
          ./build.sh package
          echo "--- 产物 ---"
          ls -la .build/dist/

      - name: 校验产物
        run: |
          cd swift
          ZIP=$(ls .build/dist/*.zip)
          echo "产物: $ZIP"
          echo "--- 包内关键文件 ---"
          unzip -l "$ZIP" | grep -E 'zstdlite|Contents/MacOS/DSHNotch$' || true
          echo "--- 二进制架构 ---"
          file .build/DSHNotch.app/Contents/MacOS/DSHNotch
          file .build/DSHNotch.app/Contents/Resources/zstdlite

      - name: 创建 Release（含附件）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          cd swift
          TAG="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
          echo "发布 tag: $TAG"
          # 两条 job 现在**互不依赖**，谁先跑谁建 release。
          # 若 win 那条先跑完，这里 download 会拿到它已合并好的 SHA256SUMS.txt，
          # 必须把自己的行并进去再回传，否则会把 win 的摘要整份覆盖掉
          # —— 插件的 parseSums 是按文件名在里面找，少了就装不了 Windows 包。
          DIST=.build/dist
          gh release download "$TAG" -p SHA256SUMS.txt --clobber 2>/dev/null || true
          if [ -f SHA256SUMS.txt ]; then
            cat "$DIST/SHA256SUMS.txt" SHA256SUMS.txt | sort -u -k2 > "$DIST/SHA256SUMS-merged.txt"
            mv "$DIST/SHA256SUMS-merged.txt" "$DIST/SHA256SUMS.txt"
            echo "--- 合并后 ---"
            cat "$DIST/SHA256SUMS.txt"
          fi
          gh release create "$TAG" \
            --title "DSH Notch ${TAG#v}" \
            --generate-notes \
            "$DIST"/*.zip "$DIST/SHA256SUMS.txt" \
          || gh release upload "$TAG" \
            "$DIST"/*.zip "$DIST/SHA256SUMS.txt" --clobber
          echo "--- 发布结果 ---"
          gh release view "$TAG"

  release-windows:
    name: Windows (x64)
    runs-on: windows-latest
    # ⚠️ 不能写 `needs: release-macos`。
    #
    # 曾经的理由是「mac 先建出 release，win 才能 upload 追加」。但那样一来，
    # **mac 只要失败，Windows 资产就永远发不出去** —— 而 Windows 恰恰是本项目
    # 侧重点之一。实测撞过一次：mac 那步只是 `swift/build.sh` 缺可执行位，
    # 结果整条链断在第一步，Windows job 直接显示 0s（未运行），
    # 症状是「明明推了 tag，Windows 资产却始终没有」。
    #
    # 不依赖也能成立：两条 job 的发布命令都是
    # `create ... || upload ... --clobber`，谁先跑谁建，另一个走 upload 追加，
    # SHA256SUMS.txt 由 win 侧下载合并后回传，双平台互不阻塞。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 版本必须与 tag 一致
        # 插件按 `DSHNotch-<release 版本>-win-<arch>.zip` 去找附件：
        # tag 是 v1.1.0 而包里写 0.1.0 的话，产物名就对不上，
        # 自动安装会一路报「两个源都取不到 SHA256SUMS.txt」—— 不在这里卡住，
        # 只能等用户在自己机器上撞见。
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          $TAG = if ($env:DISPATCH_TAG) { $env:DISPATCH_TAG } else { $env:GITHUB_REF_NAME }
          $VER = $TAG -replace '^v',''
          $PKG = (Get-Content windows/package.json | ConvertFrom-Json).version
          Write-Host "tag=$TAG  包版本=$PKG"
          if ($PKG -ne $VER) {
            Write-Error "windows/package.json 版本 $PKG 与 tag $VER 不一致，先改 windows/package.json"
            exit 1
          }
          Write-Host "✅ 版本一致"

      - name: 安装依赖
        working-directory: windows
        run: npm install

      - name: 下载 Electron 二进制
        # Electron 42 起 postinstall 不再拉二进制，必须显式装一次。
        # 版本要 ≥42：会话数据是 zstd 压缩的，解码靠 Node 内置
        # zlib.zstdDecompressSync（Electron 33 = Node 20，没有这个函数）。
        working-directory: windows
        run: npm run electron:install

      - name: 自测（数据层 / 状态推断 / 跳转桥）
        working-directory: windows
        run: npm test

      - name: 打包
        working-directory: windows
        run: npm run dist

      - name: 校验产物
        working-directory: windows
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          if (-not $zip) { Write-Error "没有 zip 产物"; exit 1 }
          Write-Host "产物: $($zip.Name)"
          # 装的时候判「完整」靠这两件：主程序 + resources/app.asar。
          # zip 里多一层 win-unpacked，所以按名字匹配而不是按路径。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = $z.Entries.FullName
          $z.Dispose()
          $names | Where-Object { $_ -like '*DSHNotch.exe' -or $_ -like '*app.asar' } | ForEach-Object { Write-Host "  $_" }
          if (-not ($names -like '*DSHNotch.exe')) { Write-Error "包里没有 DSHNotch.exe"; exit 1 }
          if (-not ($names -like '*resources/app.asar')) { Write-Error "包里没有 resources/app.asar"; exit 1 }

      - name: 上传附件（并把摘要并进 SHA256SUMS.txt）
        # ⚠️ cwd 必须是 `windows`。
        # make-sums.js 内部用 `path.resolve(__dirname, '..', 'dist')` 定位产物，
        # 也就是说**它写到哪里由自己在哪决定，与 cwd 无关**；而本步骤后面所有
        # `dist/...`、`SHA256SUMS.txt` 都是**相对 cwd** 的。
        # 两者不一致就会打架：cwd 在仓库根时，脚本把摘要写进 windows/dist/，
        # 步骤却去读根目录的 dist/SHA256SUMS.txt → 找不到 → 整步以 1 退出。
        # 实测就是这一行让 Windows 资产迟迟发不出来。把 cwd 设成 windows，
        # 两边落到同一个 dist/，问题消失。
        working-directory: windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          $TAG = if ($env:DISPATCH_TAG) { $env:DISPATCH_TAG } else { $env:GITHUB_REF_NAME }
          # 摘要格式由 scripts/make-sums.js 统一产出（`<64位hex>  两个空格  <文件名>`）。
          # 不在 CI 里另写一份哈希：三平台的命令行工具输出格式各不相同，
          # 插件的 parseSums 只认 shasum 那一种形状。
          node scripts/make-sums.js

          # ⚠️ 不能写 `gh release download ... 2>$null`。
          # Windows runner 的默认 shell 是 **PowerShell 7**（日志里可见
          # `shell: C:\Program Files\PowerShell\7\pwsh.EXE`），而 PS7 会把
          # native 命令写往 stderr 的内容当 ErrorRecord 抛出来 ——
          # `2>$null` 只重定向了流、没拦住 ErrorRecord，于是**即使命令成功**，
          # 这一步也可能以非零码收场（实测：就是它让上传步骤无故变红）。
          # 改成：用 -o 把 stderr 收成字符串，失败也不打断，并把原因打出来。
          $dlErr = (gh release download "$TAG" -p SHA256SUMS.txt --clobber -o _dl_err.txt 2>&1 | Out-String)
          if (Test-Path _dl_err.txt) {
            $t = Get-Content _dl_err.txt -Raw -ErrorAction SilentlyContinue
            if ($t) { Write-Host "下载远端摘要的输出（非致命）: $t" }
            Remove-Item _dl_err.txt -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path SHA256SUMS.txt) {
            # mac 那条先建好了 release：把它的行放前面，win 的接在后面，
            # 一份文件覆盖两个平台（安装器按文件名在里面找，不关心顺序）。
            Get-Content SHA256SUMS.txt, dist/SHA256SUMS.txt |
              Set-Content dist/SHA256SUMS-merged.txt -Encoding utf8
            Move-Item dist/SHA256SUMS-merged.txt dist/SHA256SUMS.txt -Force
          }
          Write-Host "--- 合并后 ---"
          Get-Content dist/SHA256SUMS.txt
          # __uninstaller.exe 是 NSIS 的中间产物，不是给用户下的，不上传。
          $assets = @(Get-ChildItem dist/*.zip, dist/*.exe |
            Where-Object { $_.Name -notlike '*__uninstaller*' } |
            ForEach-Object { $_.FullName }) + @((Resolve-Path dist/SHA256SUMS.txt).Path)
          gh release upload "$TAG" $assets --clobber
          Write-Host "--- 发布结果 ---"
          gh release view "$TAG"
